<div class="app" id="app">

  <!-- ===== 顶栏 + 页面切换 ===== -->
  <header class="appbar">
    <div class="appbar-txt">
      <h1 id="pageTitle">首页</h1>
    </div>

    <button class="icon-btn" id="settingsBtn" aria-label="设置">
      <svg class="ico"><use href="#i-settings"/></svg>
    </button>

    <nav class="tabbar" id="tabbar">
      <button class="tab is-active" data-tab="home">
        <svg class="ico"><use href="#i-home"/></svg><span>首页</span>
      </button>
      <button class="tab" data-tab="ledger">
        <svg class="ico"><use href="#i-ledger"/></svg><span>记账</span>
      </button>
    </nav>
  </header>

  <div class="warn-bar" id="warnBar" hidden></div>

  <!-- ===== 页面 ===== -->
  <main class="page-host" id="pageHost">

    <!-- ---------- 首页 ---------- -->
    <section class="page is-active" data-page="home" id="page-home">
      <div id="homeEmpty"></div>
      <div class="month-row">
        <button class="month-pick" id="monthPickBtn" type="button">
          <span id="monthPickTxt">本月</span>
          <svg class="ico chev"><use href="#i-chev-down"/></svg>
        </button>
      </div>
      <div id="homeHero"></div>
      <div class="stat-grid" id="homeStats"></div>
      <div id="homeBudget"></div>
      <div id="homePending"></div>
      <div id="homeCalendar"></div>
      <div id="homeCatRank"></div>
      <div class="card" id="homeTrendCard"></div>
      <div id="homeBackupTip"></div>
    </section>

    <!-- ---------- 记账 ---------- -->
    <section class="page" data-page="ledger" id="page-ledger">
      <div class="month-row">
        <button class="month-pick" id="ledgerMonthPickBtn" type="button">
          <span id="ledgerMonthPickTxt">本月</span>
          <svg class="ico chev"><use href="#i-chev-down"/></svg>
        </button>
      </div>
      <form class="card entry-card" id="entryCard" autocomplete="off" novalidate>
        <div class="seg" id="entryTypeSeg" role="tablist">
          <button type="button" class="seg-item is-active" data-type="expense">支出</button>
          <button type="button" class="seg-item" data-type="income">收入</button>
        </div>

        <div class="amount-box" id="amountBox">
          <span class="amount-cur">¥</span>
          <input class="amount-input" id="amountInput" type="text" inputmode="decimal"
                 placeholder="0.00" aria-label="金额" maxlength="12">
        </div>

        <div class="cat-grid" id="catGrid"></div>

        <div class="entry-meta">
          <label class="meta-field">
            <span class="meta-label">备注</span>
            <input id="noteInput" type="text" maxlength="40" placeholder="麦当劳 / 看电影 / 买衣服 / 狗粮…">
          </label>
          <label class="meta-field date-field">
            <span class="meta-label">日期</span>
            <input id="dateInput" type="date">
          </label>
        </div>

        <div class="entry-actions">
          <button type="submit" class="btn primary block" id="saveBtn">保存这笔</button>
        </div>
      </form>

      <div class="stat-grid sm" id="ledgerStats"></div>

      <section class="card collapsible" id="fixedCard"></section>

      <section class="card" id="detailCard"></section>
    </section>

  </main>

</div>

<div id="layerRoot"></div>

<script src="js/util.js" defer></script>
<script src="js/store.js" defer></script>
<script src="js/calc.js" defer></script>
<script src="js/actions.js" defer></script>
<script src="js/chart.js" defer></script>
<script src="js/ui.js" defer></script>
<script src="js/views.home.js" defer></script>
<script src="js/views.ledger.js" defer></script>
<script src="js/app.js" defer></script>
</body>
</html>
